apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bn-near
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: bnnear/web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: API_BASE_URL
              value: "/api/v1"
            - name: WS_BASE_URL
              value: "/api/v1/ws"
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: bn-near
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: web
