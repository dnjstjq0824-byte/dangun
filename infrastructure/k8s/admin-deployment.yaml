apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: bn-near
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: bnnear/admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: bn-near
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: admin

