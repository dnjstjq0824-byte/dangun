apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: bn-near
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: bnnear/worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bn-near-config
            - secretRef:
                name: bn-near-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

