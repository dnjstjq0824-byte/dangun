name: BN NEAR — Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test & Build (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run Backend Integration & Unit Tests
        run: go test -v ./services/api/...

      - name: Build API Gateway Binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/api ./services/api/cmd

      - name: Build Background Worker Binary
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o bin/worker ./services/worker/cmd

  mobile-verify:
    name: Mobile Verification (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./apps/mobile
        run: flutter pub get

      - name: Run Flutter Static Analysis
        working-directory: ./apps/mobile
        run: flutter analyze

      - name: Run Flutter Unit & Widget Tests
        working-directory: ./apps/mobile
        run: flutter test

  web-admin-build:
    name: Web & Admin Build (Node.js / Vue / Nuxt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Build Vue 3 Admin Cockpit
        working-directory: ./apps/admin
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Build Nuxt 3 SSR Web
        working-directory: ./apps/web
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

  docker-images-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, web-admin-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: false
          tags: bnnear/api:latest

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: false
          tags: bnnear/worker:latest
