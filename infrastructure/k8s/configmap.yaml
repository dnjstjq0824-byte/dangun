apiVersion: v1
kind: ConfigMap
metadata:
  name: bn-near-config
  namespace: bn-near
data:
  PORT: "8080"
  NODE_ENV: "production"
  GEO_VERIFICATION_ACCURACY_THRESHOLD: "150"
  STORAGE_DRIVER: "local"
  DATABASE_URL: "postgres://bn_near:bn_near_secret_password@postgres.bn-near.svc.cluster.local:5432/bn_near_db?sslmode=disable"
  REDIS_URL: "redis://redis.bn-near.svc.cluster.local:6379/0"
  API_BASE_URL: "http://api.bn-near.svc.cluster.local:8080/api/v1"
  WS_BASE_URL: "ws://api.bn-near.svc.cluster.local:8080/api/v1/ws"
